<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tübitak Kırlangıçları - Zeka Labirenti</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background: #161b22;
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            border: 1px solid #30363d;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-ana {
            background: #21262d;
            color: #f0f6fc;
            border: 1px solid #30363d;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-ana:hover { background: #30363d; }
        
        .badge-version {
            background: #238636;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        
        .header-title {
            text-align: center;
            margin-bottom: 20px;
        }
        .header-title h1 {
            color: #f85149;
            font-size: 1.8rem;
            margin-bottom: 4px;
        }
        .header-title p {
            color: #8b949e;
            font-size: 0.95rem;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: #21262d;
            border: 1px solid #30363d;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .stat-box span { color: #f0883e; }

        .game-card {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }

        .question-meta {
            color: #8b949e;
            font-size: 0.85rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .question-text {
            font-size: 1.15rem;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: #21262d;
            color: #f0f6fc;
            border: 1px solid #30363d;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            text-align: left;
        }
        .option-btn:hover {
            background: #30363d;
            border-color: #8b949e;
        }

        .helpers {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        .helper-btn {
            background: transparent;
            color: #58a6ff;
            border: 1px dashed #30363d;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .helper-btn:hover { background: rgba(88, 166, 255, 0.1); }

        .alert-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }
        .alert-box.error { background: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid #f85149; }
        .alert-box.success { background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid #2ea043; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <button class="btn-ana" onclick="location.href='index.html'">🏠 Ana Sayfa</button>
        <div class="badge-version">SÜRÜM V1 - TARİH AVCISI</div>
        <button class="btn-ana" style="visibility: hidden;">🔇</button>
    </div>

    <div class="header-title">
        <h1>Tübitak Kırlangıçları</h1>
        <p>Zeka Labirenti - Tarih Bulmacası</p>
    </div>

    <div class="stats-bar">
        <div class="stat-box">Puan: <span id="score">0</span></div>
        <div class="stat-box">Kapı: <span id="door-count">1/4</span></div>
        <div class="stat-box">Hata: <span id="error-count">0</span></div>
    </div>

    <div class="game-card">
        <div class="question-meta" id="q-number">Soru 1 / 4</div>
        <div class="question-text" id="question-text">Yükleniyor...</div>

        <div class="options-grid" id="options-container">
            <!-- Seçenekler buraya dinamik gelecek -->
        </div>

        <div class="helpers">
            <button class="helper-btn" onclick="useHint()">💡 Ücretsiz İpucu</button>
        </div>

        <div class="alert-box" id="alert-box"></div>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Selçukluların Anadolu kapılarını açtığı Malazgirt Savaşı hangi yılda gerçekleşmiştir?",
            options: ["1071", "1453", "1176", "1299"],
            answer: "1071",
            hint: "11. yüzyılın ikinci yarısında (10x1) yapılmıştır."
        },
        {
            q: "Osmanlı Devleti'nin başkenti hangi antlaşma veya olayla 1453'te İstanbul'a taşınmıştır?",
            options: ["Ankara Savaşı", "İstanbul'un Fethi", "Varna Savaşı", "Kosova Savaşı"],
            answer: "İstanbul'un Fethi",
            hint: "Fatih Sultan Mehmet'in devr-i saadetinde gerçekleşmiştir."
        },
        {
            q: "Türkiye Cumhuriyeti'nin kurucusu Mustafa Kemal Atatürk, Millî Mücadele'yi başlatmak için Samsun'a hangi yıl çıkmıştır?",
            options: ["1919", "1920", "1923", "1881"],
            answer: "1919",
            hint: "1919 yılının 19 Mayıs günüdür."
        },
        {
            q: "Birinci İnönü Savaşı sonucunda ilan edilen ve uluslararası alanda yeni devletin sesini duyuran hukuki metin hangisidir?",
            options: ["Amasya Genelgesi", "Misak-ı Millî", "Teşkilat-ı Esasiye Kanunu", "Londra Konferansı"],
            answer: "Teşkilat-ı Esasiye Kanunu",
            hint: "1921 Anayasası olarak da bilinen ilk teşkilat kanunudur."
        }
    ];

    let currentDoor = 0;
    let score = 0;
    let errors = 0;

    function loadGame() {
        if (currentDoor >= questions.length) {
            document.querySelector(".game-card").innerHTML = `
                <h2 style="color: #3fb950; margin-bottom: 15px;">🎉 Tebrikler Labirenti Geçtin!</h2>
                <p style="color: #c9d1d9; margin-bottom: 20px;">Tüm kilitli kapıları doğru açtın ve hazineye ulaştın!</p>
                <div style="font-size: 1.2rem; font-weight: bold; color: #f0883e;">Toplam Puanın: ${score}</div>
                <button class="btn-ana" style="margin-top: 20px; background: #238636; color: white;" onclick="restartGame()">Yeniden Başla</button>
            `;
            return;
        }

        const currentQ = questions[currentDoor];
        document.getElementById("q-number").innerText = `Soru ${currentDoor + 1} / 4`;
        document.getElementById("door-count").innerText = `${currentDoor + 1}/4`;
        document.getElementById("question-text").innerText = currentQ.q;
        document.getElementById("alert-box").style.display = "none";

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        currentQ.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selected) {
        const currentQ = questions[currentDoor];
        const alertBox = document.getElementById("alert-box");

        if (selected === currentQ.answer) {
            score += 25;
            document.getElementById("score").innerText = score;
            alertBox.className = "alert-box success";
            alertBox.innerText = "Doğru! Kapı açıldı, ilerliyorsun...";
            alertBox.style.display = "block";

            currentDoor++;
            setTimeout(loadGame, 1500);
        } else {
            errors++;
            document.getElementById("error-count").innerText = errors;
            alertBox.className = "alert-box error";
            alertBox.innerText = "Yanlış cevap! Tarihsel paradoks oluştu, labirentin başına dönüyorsun!";
            alertBox.style.display = "block";

            // Yanlışta oyunu / kapıları baştan başlatma kuralı
            setTimeout(() => {
                currentDoor = 0;
                loadGame();
            }, 2000);
        }
    }

    function useHint() {
        const currentQ = questions[currentDoor];
        const alertBox = document.getElementById("alert-box");
        alertBox.className = "alert-box success";
        alertBox.style.background = "rgba(88, 166, 255, 0.15)";
        alertBox.style.color = "#58a6ff";
        alertBox.style.borderColor = "#58a6ff";
        alertBox.innerText = `💡 İpucu: ${currentQ.hint}`;
        alertBox.style.display = "block";
    }

    function restartGame() {
        currentDoor = 0;
        score = 0;
        errors = 0;
        document.getElementById("score").innerText = score;
        document.getElementById("error-count").innerText = errors;
        location.reload();
    }

    // Oyunu başlat
    loadGame();
</script>

</body>
</html>
